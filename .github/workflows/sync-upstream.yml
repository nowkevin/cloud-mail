name: 🔄 Sync Upstream (auto-update)

on:
  schedule:
    - cron: "0 18 * * *" # 每天北京时间 02:00 (UTC 18:00) 检查上游更新
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  Sync-upstream:
    name: 📥 Sync from maillab/cloud-mail
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 检出仓库 / Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 📥 拉取上游 / Fetch upstream
        run: |
          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main

      - name: 🔄 合并上游 / Merge upstream/main
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BEFORE=$(git rev-parse HEAD)

          if git merge upstream/main --no-edit; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "✅ Already up to date with upstream/main."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git push origin main
              echo "✅ Synced. Pushed $(git rev-parse --short HEAD) to main."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "after_sha=$AFTER" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "::error::Merge conflict with upstream. Manual intervention required."
            exit 1
          fi

      - name: 🚀 确保部署已触发 / Ensure deploy is triggered
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AFTER_SHA="${{ steps.sync.outputs.after_sha }}"
          echo "Waiting for push-triggered deploy workflow..."
          sleep 30

          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${AFTER_SHA}" --jq '.total_count // 0')
          if [ "${RUNS}" -gt 0 ]; then
            echo "✅ Deploy workflow already triggered by push (${RUNS} run(s))."
          else
            echo "⚠️ Push did not trigger deploy. Dispatching deploy workflow manually..."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare.yml/dispatches" \
              -f ref=main
            echo "✅ Deploy workflow dispatched."
          fi

      - name: 📣 完成提示 / Summary
        if: steps.sync.outputs.changed == 'true'
        run: |
          echo "Synced to upstream commit $(git rev-parse --short upstream/main)." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy workflow will build & deploy, then apply database migrations via /api/init (data preserved)." >> "$GITHUB_STEP_SUMMARY"
