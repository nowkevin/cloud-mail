name: 🔄 Sync Upstream (auto-update)

on:
  schedule:
    - cron: "0 18 * * *" # 每天北京时间 02:00 (UTC 18:00) 检查上游更新
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  Sync-upstream:
    name: 📥 Sync from maillab/cloud-mail
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 检出仓库 / Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 📥 拉取上游 / Fetch upstream
        run: |
          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main

      - name: 🔄 变基并推送 / Rebase onto upstream/main
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BEFORE=$(git rev-parse HEAD)

          if git rebase upstream/main; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "✅ Already up to date with upstream/main."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git push origin main --force-with-lease
              echo "✅ Synced. Pushed $(git rev-parse --short HEAD) to main."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git rebase --abort
            echo "::error::Rebase conflict with upstream. Manual intervention required."
            exit 1
          fi

      - name: 📣 完成提示 / Summary
        if: steps.sync.outputs.changed == 'true'
        run: |
          echo "Synced to upstream commit $(git rev-parse --short upstream/main)." >> "$GITHUB_STEP_SUMMARY"
          echo "The deploy workflow (deploy-cloudflare.yml) will run automatically and apply database migrations via /api/init." >> "$GITHUB_STEP_SUMMARY"
